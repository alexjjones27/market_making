# Markets to backtest and the historical window to pull.
#
# `coin` must match Hyperliquid's perp ticker exactly (see the `meta` info
# endpoint universe, e.g. "BTC", "ETH", "SOL").
#
# Dates are UTC, inclusive of start, exclusive of end. candle_interval must
# be one of Hyperliquid's supported intervals:
# 1m, 3m, 5m, 15m, 30m, 1h, 2h, 4h, 8h, 12h, 1d, 3d, 1w, 1M
#
# NOTE: candleSnapshot only returns the most recent 5000 candles per call.
# The ingester paginates backward automatically, but very long windows on
# small intervals mean many API calls -- expect ingestion of a few weeks of
# 1m data to take a couple of minutes per market.

markets:
  - coin: BTC
    start_date: "2026-06-01"
    end_date: "2026-08-28"
    candle_interval: "1m"

  - coin: ETH
    start_date: "2026-06-01"
    end_date: "2026-08-28"
    candle_interval: "1m"

  - coin: SOL
    start_date: "2026-06-01"
    end_date: "2026-08-28"
    candle_interval: "1m"

cache_dir: "data_cache"
